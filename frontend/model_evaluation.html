<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型评估 - AIOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .metric-card {
            border-radius: 10px;
            transition: transform 0.2s;
        }
        .metric-card:hover {
            transform: translateY(-2px);
        }
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
        }
        .metric-label {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .trend-up { color: #dc3545; }
        .trend-down { color: #198754; }
        .trend-neutral { color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="fas fa-heartbeat"></i> MonitorSystem V1.3</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">仪表板</a>
                <a class="nav-link" href="temperature_test.html">温度测试</a>
                <a class="nav-link" href="alerts.html">告警详情</a>
                <a class="nav-link" href="memory_analysis.html">内存分析</a>
                <a class="nav-link active" href="#">模型评估</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- 筛选条件 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label">时间范围</label>
                        <select class="form-select" id="daysFilter" onchange="loadData()">
                            <option value="7">最近7天</option>
                            <option value="14">最近14天</option>
                            <option value="30" selected>最近30天</option>
                            <option value="90">最近90天</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 关键指标卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card metric-card bg-primary text-white">
                    <div class="card-body text-center">
                        <div class="metric-label">评估总数</div>
                        <div class="metric-value" id="totalCount">-</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card bg-success text-white">
                    <div class="card-body text-center">
                        <div class="metric-label">平均 R²</div>
                        <div class="metric-value" id="avgR2">-</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card bg-info text-white">
                    <div class="card-body text-center">
                        <div class="metric-label">平均 MAE</div>
                        <div class="metric-value" id="avgMae">-</div>
                        <div class="metric-label">MB</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card bg-warning text-dark">
                    <div class="card-body text-center">
                        <div class="metric-label">趋势准确率</div>
                        <div class="metric-value" id="trendAccuracy">-</div>
                        <div class="metric-label">%</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-line"></i> 评估指标趋势</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="trendChart" height="100"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-pie"></i> 模型质量分布</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="qualityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 评估列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-list"></i> 评估详情</h5>
                <span class="badge bg-success">良好 (R²≥0.7)</span>
                <span class="badge bg-warning text-dark">一般 (0.5≤R²<0.7)</span>
                <span class="badge bg-danger">较差 (R²<0.5)</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>日期</th>
                                <th>设备IP</th>
                                <th>进程名</th>
                                <th>数据点</th>
                                <th>R²</th>
                                <th>MAE</th>
                                <th>RMSE</th>
                                <th>MAPE</th>
                                <th>趋势预测</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="evaluationsBody">
                            <tr><td colspan="10" class="text-center py-4">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let trendChart = null;
        let qualityChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });

        function loadData() {
            const days = document.getElementById('daysFilter').value;
            loadSummary(days);
            loadTrend(days);
            loadEvaluations(days);
        }

        async function loadSummary(days) {
            try {
                const res = await fetch(`/api/model_evaluation/summary?days=${days}`);
                const data = await res.json();
                if (data.success) {
                    const s = data.data;
                    document.getElementById('totalCount').textContent = s.total || 0;
                    document.getElementById('avgR2').textContent = (s.avg_r2 || 0).toFixed(2);
                    document.getElementById('avgMae').textContent = (s.avg_mae || 0).toFixed(1);
                    document.getElementById('trendAccuracy').textContent = (s.trend_accuracy || 0).toFixed(0);

                    // 更新饼图
                    updateQualityChart(s);
                }
            } catch (e) {
                console.error('加载摘要失败:', e);
            }
        }

        async function loadTrend(days) {
            try {
                const res = await fetch(`/api/model_evaluation/trend?days=${days}`);
                const data = await res.json();
                if (data.success) {
                    updateTrendChart(data.data);
                }
            } catch (e) {
                console.error('加载趋势失败:', e);
            }
        }

        async function loadEvaluations(days) {
            try {
                const res = await fetch(`/api/model_evaluation/list?days=${days}`);
                const data = await res.json();
                if (data.success) {
                    updateEvaluationsTable(data.data);
                }
            } catch (e) {
                console.error('加载评估列表失败:', e);
            }
        }

        function updateTrendChart(trendData) {
            const ctx = document.getElementById('trendChart').getContext('2d');

            const labels = trendData.map(d => d.date);
            const r2Data = trendData.map(d => d.avg_r2);
            const maeData = trendData.map(d => d.avg_mae);
            const mapeData = trendData.map(d => d.avg_mape);

            if (trendChart) {
                trendChart.destroy();
            }

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'R²',
                            data: r2Data,
                            borderColor: 'rgba(25, 135, 84, 1)',
                            backgroundColor: 'rgba(25, 135, 84, 0.1)',
                            yAxisID: 'y',
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'MAE',
                            data: maeData,
                            borderColor: 'rgba(13, 202, 240, 1)',
                            backgroundColor: 'rgba(13, 202, 240, 0.1)',
                            yAxisID: 'y1',
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'MAPE(%)',
                            data: mapeData,
                            borderColor: 'rgba(255, 193, 7, 1)',
                            backgroundColor: 'rgba(255, 193, 7, 0.1)',
                            yAxisID: 'y1',
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            min: 0,
                            max: 1,
                            title: { display: true, text: 'R²' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: 'MAE/MAPE' },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        function updateQualityChart(summary) {
            const ctx = document.getElementById('qualityChart').getContext('2d');

            const good = summary.good_count || 0;
            const normal = summary.normal_count || 0;
            const poor = summary.poor_count || 0;
            const total = good + normal + poor;

            if (qualityChart) {
                qualityChart.destroy();
            }

            qualityChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['良好 (R²≥0.7)', '一般 (0.5≤R²<0.7)', '较差 (R²<0.5)'],
                    datasets: [{
                        data: [good, normal, poor],
                        backgroundColor: [
                            'rgba(25, 135, 84, 0.8)',
                            'rgba(255, 193, 7, 0.8)',
                            'rgba(220, 53, 69, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    const pct = total > 0 ? (value / total * 100).toFixed(1) : 0;
                                    return `${context.label}: ${value} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateEvaluationsTable(evaluations) {
            const tbody = document.getElementById('evaluationsBody');
            if (!evaluations || evaluations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">暂无评估数据</td></tr>';
                return;
            }

            tbody.innerHTML = evaluations.map(ev => {
                // R² 状态
                let r2Class = 'text-success';
                let statusBadge = '<span class="badge bg-success">良好</span>';
                if (ev.r2_score < 0.5) {
                    r2Class = 'text-danger';
                    statusBadge = '<span class="badge bg-danger">较差</span>';
                } else if (ev.r2_score < 0.7) {
                    r2Class = 'text-warning';
                    statusBadge = '<span class="badge bg-warning text-dark">一般</span>';
                }

                // 趋势正确性
                const trendCorrect = ev.trend_correct ? '<i class="fas fa-check text-success"></i>' : '<i class="fas fa-times text-danger"></i>';

                return `
                    <tr>
                        <td>${ev.evaluation_date || '-'}</td>
                        <td>${ev.device_ip || '-'}</td>
                        <td>${ev.process_name || '-'}</td>
                        <td>${ev.data_points || '-'}</td>
                        <td class="${r2Class} fw-bold">${ev.r2_score?.toFixed(3) || '-'}</td>
                        <td>${ev.mae?.toFixed(1) || '-'} MB</td>
                        <td>${ev.rmse?.toFixed(1) || '-'} MB</td>
                        <td>${ev.mape?.toFixed(1) || '-'}%</td>
                        <td>${ev.predicted_trend || '-'}/${ev.actual_trend || '-'} ${trendCorrect}</td>
                        <td>${statusBadge}</td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
