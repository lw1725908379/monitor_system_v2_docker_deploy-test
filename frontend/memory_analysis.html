<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内存分析 - AIOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="fas fa-heartbeat"></i> 设备监控系统</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">仪表板</a>
                <a class="nav-link" href="temperature_test.html">温度测试</a>
                <a class="nav-link" href="alerts.html">告警详情</a>
                <a class="nav-link active" href="#">内存分析</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- 控制面板 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-brain"></i> 内存分析 (AIOps)</h5>
            </div>
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label">分析天数</label>
                        <select class="form-select" id="analysisDays">
                            <option value="3">最近3天</option>
                            <option value="7" selected>最近7天</option>
                            <option value="14">最近14天</option>
                            <option value="30">最近30天</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary" onclick="runAnalysis()">
                            <i class="fas fa-play"></i> 立即分析
                        </button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-outline-danger" onclick="clearAllResults()">
                            <i class="fas fa-trash-alt"></i> 清空记录
                        </button>
                    </div>
                    <div class="col-md-4 text-end">
                        <div id="lastRunInfo" class="text-muted small"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分析结果 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-chart-line"></i> 分析结果</h5>
                <div>
                    <span class="badge bg-danger me-1">泄漏</span>
                    <span class="badge bg-success me-1">稳定</span>
                    <span class="badge bg-warning text-dark me-1">下降</span>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>设备IP</th>
                                <th>进程名</th>
                                <th>最大值(MB)</th>
                                <th>平均值(MB)</th>
                                <th>P95(MB)</th>
                                <th>标准差</th>
                                <th>增长率(MB/h)</th>
                                <th>趋势</th>
                                <th>推荐阈值(MB)</th>
                                <th>告警</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <tr><td colspan="10" class="text-center py-4">点击"立即分析"开始分析</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadLastLog();
            loadResults();
        });

        function loadLastLog() {
            fetch('/api/memory_analysis/latest_log')
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.data) {
                        const log = data.data;
                        document.getElementById('lastRunInfo').innerHTML =
                            `上次运行: ${log.start_time || '-'} ~ ${log.end_time || '进行中'} | 状态: ${log.status}`;
                    }
                });
        }

        function runAnalysis() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 分析中...';

            const days = parseInt(document.getElementById('analysisDays').value);

            fetch('/api/memory_analysis/run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({days: days})
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-play"></i> 立即分析';

                if (data.success) {
                    alert(data.summary);
                    loadResults();
                    loadLastLog();
                } else {
                    alert('分析失败: ' + (data.error || ''));
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-play"></i> 立即分析';
                alert('分析失败: ' + err);
            });
        }

        function loadResults() {
            fetch('/api/memory_analysis/results?days=30')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderResults(data.data);
                    }
                });
        }

        function renderResults(results) {
            const tbody = document.getElementById('resultsBody');
            if (!results || results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="text-center py-4 text-muted">暂无分析结果，请先点击"立即分析"</td></tr>';
                return;
            }

            const trendMap = {
                'leak': '<span class="badge bg-danger">疑似泄漏</span>',
                'down': '<span class="badge bg-warning text-dark">下降↓</span>',
                'stable': '<span class="badge bg-success">稳定→</span>'
            };

            tbody.innerHTML = results.map(r => `
                <tr>
                    <td>${r.device_ip}</td>
                    <td><code>${r.process_name}</code></td>
                    <td>${r.max_memory}</td>
                    <td>${r.avg_memory}</td>
                    <td>${r.p95_memory}</td>
                    <td>${r.std_memory || '-'}</td>
                    <td>${r.growth_rate || 0}</td>
                    <td>${trendMap[r.trend_status] || '-'}</td>
                    <td><strong>${r.recommended_memory || '-'}</strong></td>
                    <td>${r.alert_message ? '<span class="text-danger">' + r.alert_message + '</span>' : '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteMemoryRecord(${r.id})" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteMemoryRecord(id) {
            if (!confirm('确定删除该分析记录吗？')) return;

            fetch(`/api/memory_analysis/delete/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('删除成功');
                        loadResults();
                    } else {
                        alert('删除失败: ' + (data.error || ''));
                    }
                })
                .catch(err => {
                    console.error('删除失败:', err);
                    alert('删除请求失败');
                });
        }

        function clearAllResults() {
            if (!confirm('确定清空所有内存分析记录吗？此操作不可恢复！')) return;

            fetch('/api/memory_analysis/clear', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('清空成功');
                    loadResults();
                } else {
                    alert('清空失败: ' + (data.error || ''));
                }
            })
            .catch(err => {
                console.error('清空失败:', err);
                alert('清空请求失败');
            });
        }
    </script>
</body>
</html>
