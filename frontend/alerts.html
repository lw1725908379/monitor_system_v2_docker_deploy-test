<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> .filter-card { background-color: #f8f9fa; border-left: 4px solid #0d6efd; } </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="fas fa-heartbeat"></i> MonitorSystem V1.2</a>
            <div class="navbar-nav"><a class="nav-link" href="index.html">仪表板</a><a class="nav-link" href="temperature_test.html">温度测试</a><a class="nav-link" href="memory_analysis.html">内存分析</a><a class="nav-link active" href="#">告警详情</a></div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="card filter-card mb-4">
            <div class="card-body py-3">
                <form id="filterForm" class="row g-3 align-items-end">
                    <div class="col-md-2"><label class="form-label small">开始日期</label><input type="date" class="form-control form-control-sm" id="startDate"></div>
                    <div class="col-md-2"><label class="form-label small">结束日期</label><input type="date" class="form-control form-control-sm" id="endDate"></div>
                    <div class="col-md-2">
                        <label class="form-label small">产品线</label>
                        <select class="form-select form-select-sm" id="productLine">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-md-2"><label class="form-label small">告警类型</label><select class="form-select form-select-sm" id="alertType"><option value="">全部</option></select></div>
                    <div class="col-md-2"><label class="form-label small">IP搜索</label><input type="text" class="form-control form-control-sm" id="searchIp" placeholder="输入IP"></div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary btn-sm w-50" onclick="loadAlerts()"><i class="fas fa-search"></i> 查询</button>
                        <button type="button" class="btn btn-danger btn-sm w-50" onclick="deleteSelectedAlerts()"><i class="fas fa-trash"></i> 删除</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-list"></i> 告警历史记录</span>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                    <label class="form-check-label" for="selectAll">全选</label>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th width="30"></th>
                                <th>时间</th>
                                <th>设备IP</th>
                                <th>产品线</th>
                                <th>告警类型</th>
                                <th>告警详情</th>
                                <th width="50">操作</th>
                            </tr>
                        </thead>
                        <tbody id="alertsBody"><tr><td colspan="7" class="text-center py-4">加载中...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 告警级别映射
        const ALERT_LEVELS = {
            'Offline': 'danger',       // 红色 - 高
            'CoreFile': 'danger',     // 红色 - 高
            'ProcessOom': 'danger',   // 红色 - 高
            'CpuHigh': 'warning',     // 黄色 - 中
            'MemoryHigh': 'warning',  // 黄色 - 中
            'TemperatureHigh': 'warning', // 黄色 - 中
            'ProcessRestart': 'warning',   // 黄色 - 中
            'NetworkTxHigh': 'info',   // 蓝色 - 低
            'NetworkPacketLoss': 'info',   // 蓝色 - 低
            'NetworkLatency': 'info',  // 蓝色 - 低
        };

        // 告警类型中文映射
        const ALERT_NAMES = {
            'Offline': '设备离线',
            'CpuHigh': 'CPU过高',
            'MemoryHigh': '内存过高',
            'CoreFile': 'Core文件',
            'ProcessRestart': '进程重启',
            'ProcessOom': '进程OOM',
            'NetworkTxHigh': '网络发速过高',
            'NetworkPacketLoss': '网络丢包',
            'NetworkLatency': '网络延迟',
            'TemperatureHigh': '温度过高',
            'System': '系统告警'
        };

        function getAlertBadge(type) {
            const level = ALERT_LEVELS[type] || 'secondary';
            const name = ALERT_NAMES[type] || type;
            return `<span class="badge bg-${level}">${name}</span>`;
        }

        let currentAlerts = [];

        document.addEventListener('DOMContentLoaded', () => {
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - 7);
            document.getElementById('endDate').valueAsDate = end;
            document.getElementById('startDate').valueAsDate = start;
            loadOptions();
            loadAlerts();
        });

        function loadOptions() {
            fetch('/api/monitor/alerts/options').then(res => res.json()).then(res => {
                if (res.success) {
                    const pSelect = document.getElementById('productLine');
                    const aSelect = document.getElementById('alertType');
                    res.product_lines.forEach(t => { if(t) pSelect.add(new Option(t, t)); });
                    // 使用中文名称
                    res.alert_types.forEach(t => {
                        const name = ALERT_NAMES[t] || t;
                        aSelect.add(new Option(name, t));
                    });
                }
            });
        }

        function loadAlerts() {
            const params = new URLSearchParams({
                start: document.getElementById('startDate').value,
                end: document.getElementById('endDate').value,
                product_line: document.getElementById('productLine').value,
                alert_type: document.getElementById('alertType').value,
                ip: document.getElementById('searchIp').value
            });

            document.getElementById('alertsBody').innerHTML = '<tr><td colspan="7" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>';

            fetch(`/api/monitor/alerts/list?${params.toString()}`).then(res => res.json()).then(res => {
                if (res.success) {
                    currentAlerts = res.data;
                    renderTable(res.data);
                } else {
                    alert('加载失败: ' + res.msg);
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('alertsBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">暂无符合条件的告警</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(row => `
                <tr>
                    <td><input class="form-check-input alert-checkbox" type="checkbox" value="${row.id}"></td>
                    <td>${row.time}</td>
                    <td><a href="device_detail.html?ip=${row.ip}" target="_blank">${row.ip}</a></td>
                    <td><span class="badge bg-info text-dark">${row.product_line}</span></td>
                    <td>${getAlertBadge(row.type)}</td>
                    <td class="text-break">${row.message}</td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="deleteAlert(${row.id})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;
            document.querySelectorAll('.alert-checkbox').forEach(cb => cb.checked = selectAll);
        }

        function deleteAlert(id) {
            if (!confirm('确定删除该告警吗？')) return;
            deleteAlertsByIds([id]);
        }

        function deleteSelectedAlerts() {
            const checkboxes = document.querySelectorAll('.alert-checkbox:checked');
            const ids = Array.from(checkboxes).map(cb => parseInt(cb.value));

            if (ids.length === 0) {
                alert('请先选择要删除的告警');
                return;
            }

            if (!confirm(`确定删除选中的 ${ids.length} 条告警吗？`)) return;
            deleteAlertsByIds(ids);
        }

        function deleteAlertsByIds(ids) {
            fetch('/api/monitor/alerts/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ids: ids })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadAlerts();
                } else {
                    alert('删除失败: ' + (data.msg || ''));
                }
            });
        }
    </script>
</body>
</html>
