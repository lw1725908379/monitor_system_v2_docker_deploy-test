<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温度测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="fas fa-heartbeat"></i> 设备监控系统</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">仪表板</a>
                <a class="nav-link" href="memory_analysis.html">内存分析</a>
                <a class="nav-link" href="alerts.html">告警详情</a>
                <a class="nav-link active" href="#">温度测试</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- 测试控制面板 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-thermometer-half"></i> 温度测试控制</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">选择设备</label>
                        <select class="form-select" id="deviceSelect">
                            <option value="">请选择设备</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">测试类型</label>
                        <select class="form-select" id="testPhase" onchange="onTestPhaseChange()">
                            <option value="baseline">常温测试（基准）</option>
                            <option value="high">高温测试</option>
                            <option value="low">低温测试</option>
                        </select>
                    </div>
                    <div class="col-md-2" id="baselineSelectDiv" style="display:none;">
                        <label class="form-label">选择基准</label>
                        <select class="form-select" id="baselineSelect">
                            <option value="">请选择基准</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">测试时长(分钟)</label>
                        <input type="number" class="form-control" id="testDuration" value="60" min="1">
                    </div>
                    <div class="col-md-1">
                        <label class="form-label">内存阈值%</label>
                        <input type="number" class="form-control" id="memThreshold" value="10" min="1">
                    </div>
                    <div class="col-md-1">
                        <label class="form-label">温度阈值%</label>
                        <input type="number" class="form-control" id="tempThreshold" value="10" min="1">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button class="btn btn-primary w-100" onclick="startTest()">
                            <i class="fas fa-play"></i> 启动
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 测试列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-list"></i> 测试记录</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="loadTests()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>设备IP</th>
                                <th>测试类型</th>
                                <th>时长(分)</th>
                                <th>开始时间</th>
                                <th>状态</th>
                                <th>偏差阈值</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="testsBody">
                            <tr><td colspan="7" class="text-center py-4">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 测试详情模态框 -->
        <div class="modal fade" id="testDetailModal" tabindex="-1" style="max-width: 100vw;">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">测试详情</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="testDetailBody">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentTests = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadDevices();
            loadTests();
        });

        function loadDevices() {
            fetch('/api/monitor/data')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('deviceSelect');
                    Object.keys(data).forEach(ip => {
                        select.add(new Option(ip, ip));
                    });
                });
        }

        function onTestPhaseChange() {
            const phase = document.getElementById('testPhase').value;
            const baselineDiv = document.getElementById('baselineSelectDiv');
            if (phase === 'high' || phase === 'low') {
                baselineDiv.style.display = 'block';
                loadBaselines();
            } else {
                baselineDiv.style.display = 'none';
            }
        }

        function loadBaselines() {
            const ip = document.getElementById('deviceSelect').value;
            if (!ip) return;

            fetch(`/api/temperature_test/baselines?device_ip=${ip}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('baselineSelect');
                        select.innerHTML = '<option value="">请选择基准</option>';
                        data.data.forEach(b => {
                            select.add(new Option(
                                `${b.test_phase} - ${b.start_time}`,
                                b.id
                            ));
                        });
                    }
                });
        }

        function startTest() {
            const device_ip = document.getElementById('deviceSelect').value;
            const test_phase = document.getElementById('testPhase').value;
            const test_duration = parseInt(document.getElementById('testDuration').value);
            const threshold_memory_pct = parseInt(document.getElementById('memThreshold').value);
            const threshold_temp_pct = parseInt(document.getElementById('tempThreshold').value);
            const baseline_id = document.getElementById('baselineSelect').value || null;

            if (!device_ip) {
                alert('请选择设备');
                return;
            }

            if ((test_phase === 'high' || test_phase === 'low') && !baseline_id) {
                alert('请选择常温基准');
                return;
            }

            fetch('/api/temperature_test/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    device_ip,
                    test_phase,
                    test_duration,
                    threshold_memory_pct,
                    threshold_temp_pct,
                    baseline_id: baseline_id ? parseInt(baseline_id) : null
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('测试启动成功');
                    loadTests();
                } else {
                    alert('启动失败: ' + (data.msg || ''));
                }
            });
        }

        function loadTests() {
            fetch('/api/temperature_test/list')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        currentTests = data.data;
                        renderTests(data.data);
                    }
                });
        }

        function renderTests(tests) {
            const tbody = document.getElementById('testsBody');
            if (tests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">暂无测试记录</td></tr>';
                return;
            }

            const phaseMap = {'baseline': '常温基准', 'high': '高温', 'low': '低温'};
            const statusMap = {'running': '<span class="badge bg-success">进行中</span>', 'completed': '<span class="badge bg-primary">已完成</span>', 'stopped': '<span class="badge bg-secondary">已停止</span>'};

            tbody.innerHTML = tests.map(t => `
                <tr>
                    <td>${t.device_ip}</td>
                    <td><span class="badge bg-info">${phaseMap[t.test_phase] || t.test_phase}</span></td>
                    <td>${t.test_duration || '-'}</td>
                    <td>${t.start_time || '-'}</td>
                    <td>${statusMap[t.status] || t.status}</td>
                    <td><small>内存:${t.threshold_memory_pct}% 温度:${t.threshold_temp_pct}%</small></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="viewTestDetail(${t.id})">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${t.status === 'running' ? `
                        <button class="btn btn-sm btn-outline-danger" onclick="stopTest(${t.id})">
                            <i class="fas fa-stop"></i>
                        </button>
                        ` : ''}
                        <button class="btn btn-sm btn-outline-secondary" onclick="deleteTest(${t.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function viewTestDetail(testId) {
            fetch(`/api/temperature_test/detail/${testId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showTestDetail(data.data);
                    } else {
                        alert('获取详情失败');
                    }
                });
        }

        function showTestDetail(test) {
            const body = document.getElementById('testDetailBody');
            const phaseMap = {'baseline': '常温基准', 'high': '高温', 'low': '低温'};

            if (!test.data || test.data.length === 0) {
                body.innerHTML = '<p class="text-center text-muted">暂无采集数据</p>';
                new bootstrap.Modal(document.getElementById('testDetailModal')).show();
                return;
            }

            // 获取最新数据
            const latest = test.data[test.data.length - 1];
            const exceptions = latest.exceptions || [];
            const restarts = latest.process_restarts || [];
            const cores = latest.core_files || [];

            let html = `
                <div class="row mb-3">
                    <div class="col-md-4"><strong>设备IP:</strong> ${test.device_ip}</div>
                    <div class="col-md-4"><strong>测试类型:</strong> ${phaseMap[test.test_phase]}</div>
                    <div class="col-md-4"><strong>状态:</strong> ${test.status}</div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4"><strong>开始时间:</strong> ${test.start_time || '-'}</div>
                    <div class="col-md-4"><strong>内存偏差:</strong> ${latest.memory_delta_pct ? latest.memory_delta_pct.toFixed(1) : 0}%</div>
                    <div class="col-md-4"><strong>温度偏差:</strong> ${latest.thermal_delta_pct ? latest.thermal_delta_pct.toFixed(1) : 0}%</div>
                </div>
            `;

            // 异常记录
            if (exceptions.length > 0 || restarts.length > 0 || cores.length > 0) {
                html += `
                    <div class="alert alert-danger">
                        <h6><i class="fas fa-exclamation-triangle"></i> 异常记录</h6>
                        <ul class="mb-0">
                            ${exceptions.map(e => `<li>${e.message || e.type}</li>`).join('')}
                            ${restarts.map(r => `<li>进程重启: ${r.name} (PID: ${r.old_pid} -> ${r.new_pid})</li>`).join('')}
                            ${cores.map(c => `<li>Core文件: ${c.filename}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // 数据趋势
            html += `
                <h6>数据趋势 (共${test.data.length}条记录)</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>内存使用率</th>
                                <th>内存偏差%</th>
                                <th>温度偏差%</th>
                                <th>进程数</th>
                                <th>异常</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            test.data.forEach(d => {
                const excount = (d.exceptions ? d.exceptions.length : 0) + (d.process_restarts ? d.process_restarts.length : 0) + (d.core_files ? d.core_files.length : 0);
                html += `
                    <tr>
                        <td>${d.check_time}</td>
                        <td>${d.memory_usage ? d.memory_usage.toFixed(1) : '-'}%</td>
                        <td>${d.memory_delta_pct ? d.memory_delta_pct.toFixed(1) : 0}%</td>
                        <td>${d.thermal_delta_pct ? d.thermal_delta_pct.toFixed(1) : 0}%</td>
                        <td>${d.process_data ? d.process_data.length : 0}</td>
                        <td>${excount > 0 ? `<span class="badge bg-danger">${excount}</span>` : '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';

            body.innerHTML = html;
            new bootstrap.Modal(document.getElementById('testDetailModal')).show();
        }

        function stopTest(testId) {
            if (!confirm('确定停止该测试吗？')) return;

            fetch('/api/temperature_test/stop', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({test_id: testId})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadTests();
                } else {
                    alert('停止失败');
                }
            });
        }

        function deleteTest(testId) {
            if (!confirm('确定删除该测试记录吗？此操作不可恢复！')) return;

            fetch(`/api/temperature_test/delete/${testId}`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('删除成功');
                    loadTests();
                } else {
                    alert('删除失败: ' + (data.msg || ''));
                }
            })
            .catch(err => {
                console.error('删除测试失败:', err);
                alert('删除请求失败');
            });
        }
    </script>
</body>
</html>
