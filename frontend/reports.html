<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监控报告 - 设备监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .report-card { transition: all 0.3s ease; margin-bottom: 1rem; }
        .report-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-heartbeat"></i> 设备监控系统
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">仪表板</a>
                <a class="nav-link" href="temperature_test.html">温度测试</a>
                <a class="nav-link" href="memory_analysis.html">内存分析</a>
                <a class="nav-link active" href="reports.html">报表</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-file-alt"></i> 监控报告</h5>
                        <div>
                            <button class="btn btn-primary btn-sm" onclick="generateReport('daily', this)">
                                <i class="fas fa-plus"></i> 生成日报
                            </button>
                            <button class="btn btn-secondary btn-sm" onclick="generateReport('weekly', this)">
                                <i class="fas fa-plus"></i> 生成周报
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="loadReports()">
                                <i class="fas fa-sync-alt"></i> 刷新
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="reports-container" class="row">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2">加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = {
            LIST: '/api/report/list',
            GENERATE: '/api/report/generate', // POST {type: 'daily'}
            DOWNLOAD: '/api/report/download/' // + filename
        };

        document.addEventListener('DOMContentLoaded', loadReports);

        function loadReports() {
            fetch(API.LIST)
                .then(res => res.json())
                .then(data => {
                    renderReports(data.data || []);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('reports-container').innerHTML = '<div class="text-center text-danger">加载失败</div>';
                });
        }

        function renderReports(reports) {
            const container = document.getElementById('reports-container');
            if (reports.length === 0) {
                container.innerHTML = `<div class="col-12 text-center py-5 text-muted">暂无报告</div>`;
                return;
            }

            let html = '';
            reports.forEach(report => {
                const isWeekly = report.filename.includes('weekly');
                const badge = isWeekly ? '<span class="badge bg-secondary">周报</span>' : '<span class="badge bg-primary">日报</span>';
                const sizeKB = (report.size / 1024).toFixed(1);

                html += `
                <div class="col-md-6 col-lg-4">
                    <div class="card report-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h6 class="card-title text-truncate" title="${report.filename}">${report.filename}</h6>
                                ${badge}
                            </div>
                            <p class="text-muted small mb-3">
                                <i class="far fa-clock"></i> ${report.created_at}<br>
                                <i class="fas fa-hdd"></i> ${sizeKB} KB
                            </p>
                            <div class="d-flex justify-content-end">
                                <!-- 下载链接 -->
                                <a href="${API.DOWNLOAD + report.filename}" class="btn btn-sm btn-outline-success" target="_blank">
                                    <i class="fas fa-download"></i> 下载
                                </a>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function generateReport(type, btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 生成中...';
            btn.disabled = true;

            fetch(API.GENERATE, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type: type })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadReports();
                } else {
                    alert('生成失败: ' + data.msg);
                }
            })
            .catch(err => alert('请求错误'))
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
